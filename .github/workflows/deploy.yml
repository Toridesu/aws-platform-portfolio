name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aws-platform-portfolio-dev-api' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aws-platform-portfolio-dev-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'aws-platform-portfolio-dev-api-service' }}

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: app
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} .
          docker tag ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

      - name: Start ECS task and force new deployment
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --desired-count 1 \
            --force-new-deployment \
            --region ${AWS_REGION}

      - name: Wait for ECS service to become stable
        run: |
          aws ecs wait services-stable \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE} \
            --region ${AWS_REGION}

      - name: Verify API health through ALB
        run: |
          TARGET_GROUP_ARN=$(aws ecs describe-services \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE} \
            --region ${AWS_REGION} \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text)

          LOAD_BALANCER_ARN=$(aws elbv2 describe-target-groups \
            --target-group-arns "${TARGET_GROUP_ARN}" \
            --region ${AWS_REGION} \
            --query 'TargetGroups[0].LoadBalancerArns[0]' \
            --output text)

          ALB_DNS_NAME=$(aws elbv2 describe-load-balancers \
            --load-balancer-arns "${LOAD_BALANCER_ARN}" \
            --region ${AWS_REGION} \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          HEALTH_URL="http://${ALB_DNS_NAME}/health"
          echo "Checking ${HEALTH_URL}"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${HEALTH_URL}"; then
              echo
              echo "Health check succeeded."
              exit 0
            fi

            echo "Health check attempt ${attempt}/30 failed. Retrying in 10 seconds."
            sleep 10
          done

          echo "Health check failed after 30 attempts."
          exit 1

      - name: Stop ECS task
        if: always()
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --desired-count 0 \
            --region ${AWS_REGION}

          aws ecs wait services-stable \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE} \
            --region ${AWS_REGION}
